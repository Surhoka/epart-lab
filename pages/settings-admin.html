<div x-data="bloggerSettingsManager" id="blogger-settings-container" class="w-full animate-fade-in">
    <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
        <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-6">Public Blogger Integration</h4>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Konfigurasi ID dan URL untuk sinkronisasi konten dengan
            Public Blogger.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Blogger Blog ID</label>
                <input x-model="config.blogId" type="text"
                    class="w-full h-11 appearance-none rounded-lg border border-gray-300 bg-gray-50 px-4 py-2.5 text-sm text-gray-500 shadow-theme-xs dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
                    placeholder="ID Blogspot">
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Album Database Page
                    ID</label>
                <input x-model="config.pageId" type="text"
                    class="w-full h-11 appearance-none rounded-lg border border-gray-300 bg-gray-50 px-4 py-2.5 text-sm text-gray-500 shadow-theme-xs dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
                    placeholder="ID Halaman /p/album.html">
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">JSON-LD Schema Page
                    ID</label>
                <input x-model="config.pageIdJsonLd" type="text"
                    class="w-full h-11 appearance-none rounded-lg border border-gray-300 bg-gray-50 px-4 py-2.5 text-sm text-gray-500 shadow-theme-xs dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
                    placeholder="ID Halaman untuk Metadata JSON-LD">
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Web URL</label>
                <input x-model="config.webUrl" type="text"
                    class="w-full h-11 appearance-none rounded-lg border border-gray-300 bg-gray-50 px-4 py-2.5 text-sm text-gray-500 shadow-theme-xs dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
                    placeholder="https://yourblog.blogspot.com">
            </div>
        </div>

        <div class="mt-8 flex justify-end border-t border-gray-100 dark:border-gray-800 pt-6">
            <button @click="saveSettings($el)"
                class="btn flex justify-center items-center rounded-xl bg-brand-500 px-6 py-3 text-sm font-bold text-white shadow-lg shadow-brand-500/20 transition-all hover:bg-brand-600 hover:scale-105">
                Save Blogger Settings
            </button>
        </div>
    </div>
</div>
